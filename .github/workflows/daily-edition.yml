name: IN/FORME · edizione quotidiana

on:
  schedule:
    - cron: "30 10 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      force:
        description: "Riprova anche se oggi esiste già un'edizione"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: informe-daily-edition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recupera il radar
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crea l'edizione
        id: editor
        run: node scripts/update-edition.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
          INFORME_FORCE_UPDATE: ${{ inputs.force }}

      - name: Verifica il feed
        id: verify
        if: ${{ !cancelled() && steps.editor.outcome != 'skipped' }}
        run: node scripts/validate-feed.mjs data/current.json

      - name: Salva il risultato
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          if git diff --quiet -- data/current.json data/seen-urls.json data/seen-new-york-urls.json data/runtime.json data/research-italy.json; then
            echo "Nessuna modifica al feed."
            exit 0
          fi
          git config user.name "IN/FORME Editorial Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/seen-urls.json data/seen-new-york-urls.json data/runtime.json data/archive
          if [ -f data/research-italy.json ]; then git add data/research-italy.json; fi
          git commit -m "data: controlla il radar quotidiano"
          git push
