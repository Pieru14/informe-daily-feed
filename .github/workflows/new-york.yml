name: IN/FORME - New York e USA

on:
  schedule:
    - cron: "30 18 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: write

# Same lock as the morning radar: each reads the latest feed after queuing.
concurrency:
  group: informe-daily-edition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recupera il radar più recente
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cerca notizie competitor New York e USA
        id: editor
        run: node scripts/update-new-york.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Verifica il feed
        id: verify
        if: ${{ !cancelled() && steps.editor.outcome != 'skipped' }}
        run: node scripts/validate-feed.mjs data/current.json
      - name: Salva il desk indipendente
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          git add data/current.json data/seen-new-york-urls.json data/runtime-new-york.json data/archive
          if git diff --cached --quiet; then
            echo "Nessuna modifica al desk."
            exit 0
          fi
          git config user.name "IN/FORME Editorial Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: controlla il radar New York USA"
          git push
